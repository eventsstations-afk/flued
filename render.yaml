services:
  - type: web
    name: christmas-feud
    runtime: node
    plan: free
    rootDir: .
    buildCommand: "npm install && npm run build"
    startCommand: "node server/server.js"
    healthCheckPath: "/api/health"
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: "production"
